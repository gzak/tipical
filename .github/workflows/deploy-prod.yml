name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Git SHA already deployed to and validated on test'
        required: true
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1

jobs:
  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - id: meta
        name: Set image ref
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: echo "image=us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/tipical/api:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Confirm image exists in Artifact Registry
        run: gcloud artifacts docker images describe "${{ steps.meta.outputs.image }}" --quiet

      - name: Confirm image is deployed on test
        env:
          EXPECTED_IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          DEPLOYED=$(gcloud run services describe tipical-api-test \
            --region ${{ env.REGION }} \
            --format 'value(spec.template.spec.containers[0].image)')
          if [ "$DEPLOYED" != "$EXPECTED_IMAGE" ]; then
            echo "Deployed image does not match expected (deployed: $DEPLOYED, expected: $EXPECTED_IMAGE)"
            exit 1
          fi
          echo "Confirmed: $EXPECTED_IMAGE is deployed on tipical-api-test"

  run-migrations-prod:
    name: Run Migrations (Prod)
    needs: validate-tag
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Update migration job image
        run: |
          gcloud run jobs update tipical-migrate-prod \
            --image ${{ needs.validate-tag.outputs.image }} \
            --region ${{ env.REGION }} \
            --max-retries 0

      - name: Execute migrations
        run: |
          gcloud run jobs execute tipical-migrate-prod \
            --region ${{ env.REGION }} \
            --wait

  deploy-api-prod:
    name: Deploy API (Prod)
    needs: [validate-tag, run-migrations-prod]
    runs-on: ubuntu-latest
    environment: prod
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          gcloud run deploy tipical-api-prod \
            --image ${{ needs.validate-tag.outputs.image }} \
            --region ${{ env.REGION }} \
            --add-cloudsql-instances ${{ vars.GCP_PROJECT_ID }}:${{ env.REGION }}:tipical-db-prod \
            --set-secrets "ConnectionStrings__DefaultConnection=prod-db-connection-string:latest,GooglePlaces__ApiKey=prod-google-places-api-key:latest,GoogleOAuth__ClientId=prod-google-oauth-client-id:latest,JwtSettings__Secret=prod-jwt-secret:latest" \
            --set-env-vars "^|^ASPNETCORE_ENVIRONMENT=Production|AllowedUsers__Enabled=${{ vars.ALLOWED_USERS_ENABLED }}|Serilog__WriteTo__0__Name=GoogleCloudLogging|Serilog__WriteTo__0__Args__projectId=${{ vars.GCP_PROJECT_ID }}|Serilog__WriteTo__0__Args__serviceName=tipical-api-prod|Serilog__WriteTo__0__Args__serviceVersion=${IMAGE_TAG}|OpenTelemetry__ServiceName=tipical-api-prod|OpenTelemetry__ServiceVersion=${IMAGE_TAG}|OpenTelemetry__GcpProjectId=${{ vars.GCP_PROJECT_ID }}|OpenTelemetry__Otlp__Endpoint=https://telemetry.googleapis.com/v1/traces" \
            --service-account tipical-api-prod@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --quiet

          URL=$(gcloud run services describe tipical-api-prod \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT

  build-and-deploy-frontend-prod:
    name: Build and Deploy Frontend (Prod)
    needs: deploy-api-prod
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.image_tag }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: tipical-frontend/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: tipical-frontend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tipical-frontend

      - name: Build
        run: pnpm run build
        working-directory: tipical-frontend
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ vars.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.VITE_GOOGLE_OAUTH_CLIENT_ID }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.22.3

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting:tipical

  smoke-test-prod:
    name: Smoke Test (Prod)
    needs: [build-and-deploy-frontend-prod, deploy-api-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ needs.deploy-api-prod.outputs.url }}/api/v1/businesses/search?latitude=47.6062&longitude=-122.3321&radius=5000")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: expected 200, got $STATUS"
            exit 1
          fi
          echo "Smoke test passed: $STATUS"
