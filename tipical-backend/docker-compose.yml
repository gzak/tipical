services:
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    container_name: tipical-postgres
    environment:
      POSTGRES_DB: tipical
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "6543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tipical-api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=tipical;Username=postgres;Password=password
      - GooglePlaces__ApiKey=${GOOGLE_PLACES_API_KEY}
      - GoogleOAuth__ClientId=${GOOGLE_OAUTH_CLIENT_ID}
      - JwtSettings__Secret=${JWT_SECRET}
      - JwtSettings__Issuer=TipicalApi
      - JwtSettings__Audience=TipicalApp
      - JwtSettings__ExpirationHours=24
      - Cors__AllowedOrigins__0=http://localhost:5173
    ports:
      - "5050:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
